---
name: Build Runner Images

on:
  push:
    branches: [main]
    paths:
      - "homelab-core/**"
      - "homelab-pr-impact/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "homelab-core/**"
      - "homelab-pr-impact/**"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - homelab-core
          - homelab-pr-impact
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract base image version
        id: meta
        run: |
          version=$(grep -oP '(?<=actions-runner:)\S+' "${{ matrix.image }}/Dockerfile")
          echo "base_version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          file: ${{ matrix.image }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ steps.meta.outputs.base_version }}
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ steps.meta.outputs.base_version }}-${{ steps.meta.outputs.date }}
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  test:
    name: Test ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: homelab-core
            test: "python3 -m pip --version && pip install --user yamllint pre-commit detect-secrets && yamllint --version && pre-commit --version"
          - image: homelab-pr-impact
            test: "gh --version && helm version --short && crane version && uv --version && kubectl version --client && claude --version"
    steps:
      - name: Smoke test
        run: |
          docker run --rm "ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest" \
            bash -c '${{ matrix.test }}'
